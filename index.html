<!doctype html><html lang="sw"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050505"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg"><link rel="stylesheet" href="style.css"><title>____yk4x Browser V2</title></head><body>
<header><button id="menu">☰</button><b>____yk4x <small>V2</small></b><button id="private">🕶</button></header>
