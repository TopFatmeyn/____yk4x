<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<meta name="description" content="____yk4x futuristic phone browser">
<link rel="manifest" href="manifest.json">
<title>____yk4x Browser</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg"></div>
<header>
  <div class="brand">____<span>yk4x</span></div>
  <button id="menuBtn" class="icon">☰</button>
</header>

<main>
  <section class="hero">
    <div class="orb"></div>
    <p class="eyebrow">● PHONE WEB BROWSER</p>
    <h1>____<span>yk4x</span><br>Browser</h1>
    <p class="sub">Fast. Simple. Futuristic.</p>

    <form id="searchForm" class="search">
      <span>⌕</span>
      <input id="urlInput" autocomplete="off" placeholder="Search or enter website">
      <button>GO</button>
    </form>

    <div class="quick">
      <button data-url="https://www.google.com">Google</button>
      <button data-url="https://www.youtube.com">YouTube</button>
      <button data-url="https://github.com">GitHub</button>
    </div>
  </section>

  <section class="panel">
    <div class="panelTitle"><span>QUICK ACCESS</span><small id="status">READY</small></div>
    <div id="bookmarks" class="cards"></div>
  </section>

  <section class="panel">
    <div class="panelTitle"><span>TOOLS</span></div>
    <div class="tools">
      <button id="back">←<small>Back</small></button>
      <button id="forward">→<small>Forward</small></button>
      <button id="home">⌂<small>Home</small></button>
      <button id="bookmark">★<small>Save</small></button>
    </div>
  </section>

  <section class="panel">
    <div class="panelTitle"><span>YOUR NOTES</span></div>
    <textarea id="notes" placeholder="Write something..."></textarea>
    <button id="saveNotes" class="wide">SAVE NOTES</button>
  </section>
</main>

<nav id="drawer" class="drawer">
  <button id="closeMenu">×</button>
  <h2>____yk4x</h2>
  <a href="https://www.google.com" target="_blank">Google</a>
  <a href="https://www.youtube.com" target="_blank">YouTube</a>
  <a href="https://github.com" target="_blank">GitHub</a>
  <button id="installBtn" hidden>Install App</button>
</nav>

<footer>____yk4x Browser • Built for mobile</footer>
<script src="script.js"></script>
</body>
</html>
